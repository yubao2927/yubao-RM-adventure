<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1280" height="760" fill="#fafafa"/>
  <text x="640" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">MPU6050 双板姿态采集系统接线图（STM32F103C8 最小系统板 ×2）</text>
  <text x="640" y="66" text-anchor="middle" font-size="13" fill="#666">软件 I2C：SCL=PB10，SDA=PB11 ｜ 从机 USART1 ↔ 主机 USART1（板间）｜ 主机 USART2 → USB-TTL → PC（Serial Studio Pro）</text>

  <!-- ================= 图例 ================= -->
  <g font-size="13" fill="#333">
    <rect x="940" y="86" width="310" height="150" rx="8" fill="#ffffff" stroke="#bbb"/>
    <text x="958" y="112" font-weight="bold" font-size="14">图例</text>
    <line x1="958" y1="132" x2="1010" y2="132" stroke="#1565c0" stroke-width="2.5"/>
    <text x="1020" y="137">UART 板间通信（460800）</text>
    <line x1="958" y1="156" x2="1010" y2="156" stroke="#e65100" stroke-width="2.5"/>
    <text x="1020" y="161">UART 与 PC 通信（460800）</text>
    <line x1="958" y1="180" x2="1010" y2="180" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="1020" y="185">I²C 软件模拟总线</text>
    <line x1="958" y1="204" x2="1010" y2="204" stroke="#c62828" stroke-width="2.5"/>
    <text x="1020" y="209">3.3V 电源（红）/ GND（黑）</text>
    <text x="958" y="228" font-size="12" fill="#2e7d32">注：板间 USART1 两端均已统一为</text>
    <text x="958" y="242" font-size="12" fill="#2e7d32">460800，主机 USART2 对 PC 亦为 460800。</text>
  </g>

  <!-- ================= PC ================= -->
  <rect x="30" y="330" width="150" height="130" rx="10" fill="#eef2ff" stroke="#3949ab" stroke-width="2"/>
  <text x="105" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a237e">PC</text>
  <text x="105" y="396" text-anchor="middle" font-size="13" fill="#3949ab">Serial Studio Pro</text>
  <text x="105" y="416" text-anchor="middle" font-size="12" fill="#666">波形图.ssproj</text>
  <text x="105" y="436" text-anchor="middle" font-size="12" fill="#666">COM6 ｜ 460800</text>
  <circle cx="180" cy="395" r="4" fill="#3949ab"/>

  <!-- ================= USB-TTL ================= -->
  <rect x="250" y="330" width="150" height="130" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="325" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#bf360c">USB 转 TTL</text>
  <text x="325" y="396" text-anchor="middle" font-size="12" fill="#8d6e63">CH340 / CP2102</text>
  <text x="325" y="416" text-anchor="middle" font-size="12" fill="#8d6e63">电平拨到 3.3V</text>
  <circle cx="400" cy="355" r="4" fill="#e65100"/>
  <text x="393" y="350" text-anchor="end" font-size="12" fill="#bf360c">RX</text>
  <circle cx="400" cy="400" r="4" fill="#e65100"/>
  <text x="393" y="395" text-anchor="end" font-size="12" fill="#bf360c">TX</text>
  <circle cx="400" cy="440" r="4" fill="#212121"/>
  <text x="393" y="435" text-anchor="end" font-size="12" fill="#333">GND</text>

  <!-- ================= 主机 Blue Pill ================= -->
  <rect x="480" y="120" width="260" height="500" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="610" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d47a1">主机：RM-Host</text>
  <text x="610" y="170" text-anchor="middle" font-size="12" fill="#546e7a">STM32F103C8 Blue Pill</text>
  <text x="610" y="188" text-anchor="middle" font-size="12" fill="#546e7a">USART1=板间 ｜ USART2=PC</text>

  <!-- 主机左侧引脚（面向 USB-TTL） -->
  <circle cx="480" cy="360" r="5" fill="#e65100"/>
  <text x="492" y="364" font-size="13" fill="#bf360c">PA3 — USART2_RX</text>
  <circle cx="480" cy="405" r="5" fill="#e65100"/>
  <text x="492" y="409" font-size="13" fill="#bf360c">PA2 — USART2_TX</text>
  <circle cx="480" cy="440" r="5" fill="#212121"/>
  <text x="492" y="444" font-size="13" fill="#333">GND</text>
  <circle cx="480" cy="590" r="5" fill="#f9a825"/>
  <text x="492" y="594" font-size="13" fill="#e65100">PC13 — LED（板上）</text>

  <!-- 主机右侧引脚（面向从机） -->
  <circle cx="740" cy="190" r="5" fill="#1565c0"/>
  <text x="726" y="194" text-anchor="end" font-size="13" fill="#0d47a1">PA9 — USART1_TX</text>
  <circle cx="740" cy="235" r="5" fill="#1565c0"/>
  <text x="726" y="239" text-anchor="end" font-size="13" fill="#0d47a1">PA10 — USART1_RX</text>
  <circle cx="740" cy="520" r="5" fill="#212121"/>
  <text x="726" y="524" text-anchor="end" font-size="13" fill="#333">GND（共地）</text>

  <!-- ================= 从机 Blue Pill ================= -->
  <rect x="810" y="120" width="260" height="500" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="940" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b5e20">从机：new-RM-mpu6020</text>
  <text x="940" y="170" text-anchor="middle" font-size="12" fill="#546e7a">STM32F103C8 Blue Pill</text>
  <text x="940" y="188" text-anchor="middle" font-size="12" fill="#546e7a">TIM2 1kHz 触发采样 ｜ 软件 I²C</text>

  <!-- 从机左侧引脚（面向主机） -->
  <circle cx="810" cy="190" r="5" fill="#1565c0"/>
  <text x="822" y="194" font-size="13" fill="#0d47a1">PA9 — USART1_TX</text>
  <circle cx="810" cy="235" r="5" fill="#1565c0"/>
  <text x="822" y="239" font-size="13" fill="#0d47a1">PA10 — USART1_RX</text>
  <circle cx="810" cy="520" r="5" fill="#212121"/>
  <text x="822" y="524" font-size="13" fill="#333">GND（共地）</text>
  <circle cx="810" cy="560" r="5" fill="#c62828"/>
  <text x="822" y="564" font-size="13" fill="#c62828">3V3</text>

  <!-- 从机右侧引脚（面向 MPU6050） -->
  <circle cx="1070" cy="390" r="5" fill="#2e7d32"/>
  <text x="1056" y="394" text-anchor="end" font-size="13" fill="#1b5e20">PB10 — SCL</text>
  <circle cx="1070" cy="440" r="5" fill="#2e7d32"/>
  <text x="1056" y="444" text-anchor="end" font-size="13" fill="#1b5e20">PB11 — SDA</text>
  <circle cx="1070" cy="490" r="5" fill="#c62828"/>
  <text x="1056" y="494" text-anchor="end" font-size="13" fill="#c62828">3V3</text>
  <circle cx="1070" cy="540" r="5" fill="#212121"/>
  <text x="1056" y="544" text-anchor="end" font-size="13" fill="#333">GND</text>

  <!-- ================= MPU6050 ================= -->
  <rect x="1120" y="320" width="135" height="300" rx="10" fill="#f1f8e9" stroke="#558b2f" stroke-width="2"/>
  <text x="1187" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#33691e">MPU6050</text>
  <text x="1187" y="366" text-anchor="middle" font-size="12" fill="#666">GY-521 模块</text>
  <circle cx="1120" cy="390" r="5" fill="#2e7d32"/>
  <text x="1133" y="394" font-size="13" fill="#1b5e20">SCL</text>
  <circle cx="1120" cy="440" r="5" fill="#2e7d32"/>
  <text x="1133" y="444" font-size="13" fill="#1b5e20">SDA</text>
  <circle cx="1120" cy="490" r="5" fill="#c62828"/>
  <text x="1133" y="494" font-size="13" fill="#c62828">VCC</text>
  <circle cx="1120" cy="540" r="5" fill="#212121"/>
  <text x="1133" y="544" font-size="13" fill="#333">GND</text>
  <circle cx="1120" cy="585" r="5" fill="#8d6e63"/>
  <text x="1133" y="589" font-size="13" fill="#5d4037">AD0</text>
  <path d="M1110,585 C 1095,585 1095,540 1110,540" fill="none" stroke="#8d6e63" stroke-width="1.5"/>
  <text x="1080" y="572" text-anchor="middle" font-size="11" fill="#5d4037">AD0 接 GND</text>
  <text x="1078" y="608" text-anchor="middle" font-size="11" fill="#5d4037">地址=0x68</text>

  <!-- ================= 连接线 ================= -->
  <!-- PC ↔ USB-TTL（USB） -->
  <line x1="180" y1="395" x2="250" y2="395" stroke="#616161" stroke-width="3"/>
  <text x="215" y="388" text-anchor="middle" font-size="12" fill="#424242">USB</text>

  <!-- USB-TTL ↔ 主机 USART2 -->
  <line x1="400" y1="355" x2="480" y2="360" stroke="#e65100" stroke-width="2.5"/>
  <text x="440" y="346" text-anchor="middle" font-size="12" fill="#bf360c">USB-TTL TX → PA3(RX)</text>
  <line x1="400" y1="400" x2="480" y2="405" stroke="#e65100" stroke-width="2.5"/>
  <text x="440" y="423" text-anchor="middle" font-size="12" fill="#bf360c">USB-TTL RX ← PA2(TX)</text>
  <line x1="400" y1="440" x2="480" y2="440" stroke="#212121" stroke-width="2.5"/>

  <!-- 主机 ↔ 从机 USART1 -->
  <path d="M740,190 C 775,190 775,235 810,235" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <path d="M810,190 C 775,190 775,235 740,235" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <text x="775" y="184" text-anchor="middle" font-size="12" fill="#0d47a1">TX1 → RX1</text>
  <text x="775" y="252" text-anchor="middle" font-size="12" fill="#0d47a1">TX1 → RX1</text>
  <text x="775" y="268" text-anchor="middle" font-size="12" fill="#0d47a1">USART1 板间 460800</text>
  <line x1="740" y1="520" x2="810" y2="520" stroke="#212121" stroke-width="2.5"/>
  <text x="775" y="512" text-anchor="middle" font-size="12" fill="#333">GND 共地</text>

  <!-- 从机 ↔ MPU6050（软件 I2C + 电源） -->
  <line x1="1070" y1="390" x2="1120" y2="390" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="1095" y="382" text-anchor="middle" font-size="12" fill="#1b5e20">SCL</text>
  <line x1="1070" y1="440" x2="1120" y2="440" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="1095" y="432" text-anchor="middle" font-size="12" fill="#1b5e20">SDA</text>
  <text x="1095" y="416" text-anchor="middle" font-size="11" fill="#558b2f">软件 I²C（开漏+上拉）</text>
  <path d="M1070,490 C 1095,490 1095,490 1120,490" fill="none" stroke="#c62828" stroke-width="2.5"/>
  <text x="1095" y="483" text-anchor="middle" font-size="12" fill="#c62828">3V3</text>
  <line x1="1070" y1="540" x2="1120" y2="540" stroke="#212121" stroke-width="2.5"/>
  <text x="1095" y="532" text-anchor="middle" font-size="12" fill="#333">GND</text>

  <!-- 底部说明 -->
  <g font-size="13" fill="#444">
    <text x="30" y="680">供电说明：两块 Blue Pill 各自由 ST-Link / USB 供电；MPU6050 由从机 3.3V 供电。</text>
    <text x="30" y="702">三处必须共地：从机 GND — 主机 GND — USB-TTL GND — MPU6050 GND（同一条 GND 网络）。</text>
    <text x="30" y="724">USB-TTL 模块若带 5V/3.3V 电平选择，请拨到 3.3V；不要用 5V 直接给开发板 IO 供电。</text>
  </g>
</svg>
